global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "bliss-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:5001"]
        labels:
          service: "bliss-api"
          environment: "local-dev"
