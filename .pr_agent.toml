[pr_reviewer]
enable_intro_text = false
enable_help_text = false

extra_instructions = """
You are reviewing code for Bliss Atelier Perfumes, an enterprise e-commerce platform built in Go and PostgreSQL (pgx).

CRITICAL ARCHITECTURAL & CONCURRENCY CHECKS:
1. Concurrency & Transactions: Verify PostgreSQL transactions use 'FOR UPDATE' row locks for any inventory or order state mutations to avoid race conditions.
2. Connection Safety: Ensure queries inside transactions strictly use 'tx', not the parent connection pool, and ensure 'defer tx.Rollback(ctx)' is present.
3. Goroutine Lifecycles: Do not allow unbounded background goroutines in HTTP handlers. All async tasks must honor context cancellation.
4. Error Handling: Ensure Go errors are properly checked and wrapped ('fmt.Errorf(\"...: %w\", err)'). Never allow ignored errors ('_ = ...').

DOMAIN & BUSINESS LOGIC INVARIANTS:
1. Payment Invariant: Fulfillment or dispatch MUST NOT occur without verified, settled payment. Cash-on-delivery (COD) is strictly forbidden.
2. Stock Ledger Integrity: Stock mutations must balance against an immutable audit ledger ('stock_entry') with actor and evidence attributes. No public unauthenticated stock writes.

NOISE REDUCTION RULES:
- Ignore trivial style, naming preferences, or whitespace (handled by gofmt).
- Only comment on issues with high impact on correctness, concurrency, security, or data integrity.
- If no critical issues are found, state that the changes satisfy all domain and concurrency invariants.
"""

[pr_code_suggestions]
suggestions_score_threshold = 7

extra_instructions = """
Only propose code diffs that prevent race conditions, resolve transactional bugs, enforce business invariants, or fix explicit security vulnerabilities. Do not suggest cosmetic rewrites.
"""
