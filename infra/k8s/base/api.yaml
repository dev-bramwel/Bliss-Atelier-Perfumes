apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bliss-local
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 5001
      targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bliss-local
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: bliss-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: bliss-backend:local
          imagePullPolicy: IfNotPresent
          command: ["/app/api"]
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: GO_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_HTTP_ADDR
            - name: GO_DATABASE_URL_FILE
              value: "/run/secrets/runtime_url"
            - name: GO_MANAGER_SECRET_FILE
              value: "/run/secrets/manager_secret"
            - name: GO_REQUIRE_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_REQUIRE_SCHEMA
            - name: GO_IO_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_IO_TIMEOUT
            - name: GO_DB_MAX_CONNECTIONS
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_DB_MAX_CONNECTIONS
            - name: GO_TRUSTED_PROXIES
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_TRUSTED_PROXIES
            - name: GO_REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_REDIS_URL
            - name: GO_GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_GOOGLE_CLIENT_ID
            - name: GO_GOOGLE_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_GOOGLE_REDIRECT_URL
            - name: GO_BOOTSTRAP_OWNER_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_BOOTSTRAP_OWNER_EMAIL
          ports:
            - containerPort: 5001
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5001
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 4
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: bliss-secrets
