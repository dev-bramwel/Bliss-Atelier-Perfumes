apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: bliss-local
  labels:
    app: migrate
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: migrate
    spec:
      serviceAccountName: bliss-migrate
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: bliss-backend:local
          imagePullPolicy: IfNotPresent
          command: ["/app/devstack"]
          args: ["migrate"]
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: BLISS_LOCAL_DEV
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: BLISS_LOCAL_DEV
            - name: GO_DATABASE_URL_FILE
              value: "/run/secrets/migrator_url"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: bliss-secrets
