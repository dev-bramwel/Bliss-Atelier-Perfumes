name: PR Agent

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

  issue_comment:
    types:
      - created

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name != 'issue_comment' || github.event.issue.pull_request) }}
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430 # v0.49.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO__GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # LLM Model configuration
          config.model: "gemini/gemini-3.8-flash"
          config.fallback_models: '[]'
          config.custom_model_max_tokens: "32000"
          config.max_model_tokens: "32000"
          config.reasoning_effort: "low"

          # Automatic actions
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"

          # Events that trigger automatic reviews
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
