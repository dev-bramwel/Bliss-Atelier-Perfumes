<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14110d">
    <title>Offline | Bliss Atelier Perfumes</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #14110d;
            color: #faf7f2;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
        }
        main { max-width: 420px; }
        .brand {
            color: #d4af37;
            font: 64px Georgia, serif;
        }
        h1 { font: 32px Georgia, serif; }
        p { color: #c4b9aa; line-height: 1.7; }
        button {
            background: #d4af37;
            color: #14110d;
            border: 0;
            border-radius: 8px;
            padding: 14px 36px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">BP</div>
        <p>BLISS ATELIER PERFUMES</p>
        <h1>The Scent Is Paused</h1>
        <p>You're currently offline. Reconnect to the internet to continue exploring your favourite fragrances.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </main>
</body>
</html>
