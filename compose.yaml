name: ${COMPOSE_PROJECT_NAME:-bliss}

x-app: &app
  image: bliss-backend:${BLISS_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: backend/Dockerfile
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  mem_limit: 128m
  cpus: 0.5
  networks: [private]
  init: true
  stop_grace_period: 15s

services:
  db:
    image: bliss-postgres:${BLISS_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/docker/postgres.Dockerfile
    user: "70:70"
    environment:
      POSTGRES_USER: bliss_admin
      POSTGRES_DB: bliss_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [admin_password, migrator_password, runtime_password]
    volumes:
      - database:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [private]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bliss_admin -d bliss_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 20s

  migrate:
    <<: *app
    entrypoint: [/app/devstack]
    command: [migrate]
    environment:
      BLISS_LOCAL_DEV: "1"
      GO_DATABASE_URL_FILE: /run/secrets/migrator_url
    secrets: [migrator_url]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *app
    environment:
      GO_HTTP_ADDR: 0.0.0.0:5001
      GO_DATABASE_URL_FILE: /run/secrets/runtime_url
      GO_REQUIRE_SCHEMA: "true"
      GO_IO_TIMEOUT: 15s
      GO_DB_MAX_CONNECTIONS: "16"
    secrets: [runtime_url]
    depends_on:
      migrate: { condition: service_completed_successfully }
      fake-provider: { condition: service_healthy }
    healthcheck:
      test: [CMD, /app/probe, "http://127.0.0.1:5001/health/ready"]
      interval: 3s
      timeout: 4s
      retries: 15

  fake-provider:
    <<: *app
    entrypoint: [/app/fakeprovider]
    healthcheck:
      test: [CMD, /app/probe, "http://127.0.0.1:8090/health/live"]
      interval: 3s
      timeout: 4s
      retries: 15

  frontend:
    image: bliss-frontend:${BLISS_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    user: "10001:10001"
    ports: ["127.0.0.1:${BLISS_HTTP_PORT:-8080}:8080"]
    networks: [edge, private]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, /app/probe, "http://127.0.0.1:8080/api/health/ready"]
      interval: 3s
      timeout: 4s
      retries: 15

networks:
  edge: {}
  private:
    internal: true
volumes:
  database: {}
secrets:
  admin_password:
    file: ${BLISS_SECRET_DIR:-./.local/dev}/admin_password
  migrator_password:
    file: ${BLISS_SECRET_DIR:-./.local/dev}/migrator_password
  runtime_password:
    file: ${BLISS_SECRET_DIR:-./.local/dev}/runtime_password
  migrator_url:
    file: ${BLISS_SECRET_DIR:-./.local/dev}/migrator_url
  runtime_url:
    file: ${BLISS_SECRET_DIR:-./.local/dev}/runtime_url
