apiVersion: v1
kind: Service
metadata:
  name: fake-provider
  namespace: bliss-local
  labels:
    app: fake-provider
spec:
  selector:
    app: fake-provider
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-provider
  namespace: bliss-local
  labels:
    app: fake-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-provider
  template:
    metadata:
      labels:
        app: fake-provider
    spec:
      serviceAccountName: bliss-fake-provider
      automountServiceAccountToken: false
      containers:
        - name: fake-provider
          image: bliss-backend:local
          imagePullPolicy: IfNotPresent
          command: ["/app/fakeprovider"]
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8090
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 24Mi
            limits:
              cpu: 150m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8090
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
