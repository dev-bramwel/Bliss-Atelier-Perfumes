apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bliss-ingress
  namespace: bliss-local
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - bliss.local
      secretName: bliss-tls
  rules:
    - host: bliss.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
