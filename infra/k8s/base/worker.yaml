apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: bliss-local
  labels:
    app: worker
spec:
  selector:
    app: worker
  ports:
    - name: metrics
      port: 5002
      targetPort: 5002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: bliss-local
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      serviceAccountName: bliss-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 25
      containers:
        - name: worker
          image: bliss-backend:local
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: GO_WORKER_METRICS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_WORKER_METRICS_ADDR
            - name: GO_DATABASE_URL_FILE
              value: "/run/secrets/runtime_url"
            - name: GO_RABBITMQ_URL_FILE
              value: "/run/secrets/rabbitmq_url"
            - name: GO_REQUIRE_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_REQUIRE_SCHEMA
            - name: GO_IO_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_IO_TIMEOUT
            - name: GO_DB_MAX_CONNECTIONS
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_WORKER_DB_MAX_CONNECTIONS
            - name: GO_REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_REDIS_URL
            - name: GO_KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_KAFKA_BROKERS
            - name: GO_KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_KAFKA_TOPIC
            - name: GO_KAFKA_CONSUMER_GROUP
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_KAFKA_CONSUMER_GROUP
            - name: GO_KAFKA_RETENTION_MS
              valueFrom:
                configMapKeyRef:
                  name: bliss-config
                  key: GO_KAFKA_RETENTION_MS
          ports:
            - containerPort: 5002
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 4
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: bliss-secrets
